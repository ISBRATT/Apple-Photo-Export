name: macOS build and tests
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test and build app bundle
        run: bash scripts/build-app.sh
      - name: Archive app
        run: ditto -c -k --sequesterRsrc --keepParent 'dist/Apple Photo Export.app' dist/ApplePhotoExport.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ApplePhotoExport-macOS
          path: dist/ApplePhotoExport.zip
